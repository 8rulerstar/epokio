<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Epokio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231c1f3d'/%3E%3Cpath d='M22.7 32 H44.8 A12.8 12.8 0 1 0 41.8 40.2' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='41.8' cy='40.2' r='4.2' fill='%2322d3ee'/%3E%3C/svg%3E">
<!--
  Epokio 웹 화면. agent가 이 파일 하나를 내준다(외부 라이브러리·CDN 없음, 오프라인 LAN에서도 된다).
  맥 앱 Studio와 같은 기능: 학습 목록·상세(계보·단계 포함)·비교·검수·스윕·알림. 윈도우·리눅스·폰에서 쓴다.
  보기는 토큰 없이, 실행(판정 저장·학습 시작·대기열 등)은 처음 한 번 토큰을 붙여 넣으면 브라우저가 기억한다.
  토큰은 요청 머리말(Authorization)로만 보내고 주소에는 싣지 않는다. 그림(<img>)용은 agent가 주는 HttpOnly 쿠키.
  화면 언어는 영어·한국어(lang.js의 KO 표, 머리말의 언어 버튼). agent 문장도 같은 언어로 받는다(Accept-Language).
  파일: tokens.css(자동 생성, 디자인 토큰) · style.css · lang.js(언어·저장소, 먼저) · app.js(공통·목록·상세) · compare.js · alerts.js
        · train.js(잠금·학습 시작) · queue.js(대기열) · review.js · sweeps.js · versions.js · table.js(학습 기록 표) · ssh.js(SSH 서버 상태) · main.js(시작, 마지막)
  ★마이크로인터랙션: 누름·올림·나타남·숫자 변화. prefers-reduced-motion이면 멈춘다.
-->
<link rel="stylesheet" href="web/tokens.css">
<link rel="stylesheet" href="web/style.css">
</head>
<body>
<header>
  <h1><svg width="22" height="22" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#1c1f3d"/><path d="M22.7 32 H44.8 A12.8 12.8 0 1 0 41.8 40.2" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="41.8" cy="40.2" r="4.2" fill="#22d3ee"/></svg>Epokio</h1>
  <span class="sub" id="where"></span>
  <span class="pill ro" id="ro" hidden></span>
  <div class="sys" id="sys"></div>
  <button class="btn small" id="lang" type="button"></button>
</header>
<nav>
  <!-- 탭: 화살표·Home·End로 옮긴다(로빙 tabindex, main.js). 더 보기 단추는 탭이 아니라 목록 밖에 둔다 -->
  <div role="tablist" id="tabs" aria-label="Sections">
    <button role="tab" data-tab="runs" id="tab-runs" aria-controls="main" class="on" aria-selected="true">Runs</button>
    <button role="tab" data-tab="table" id="tab-table" aria-controls="main" aria-selected="false" tabindex="-1">Table</button>
    <button role="tab" data-tab="train" id="tab-train" aria-controls="main" aria-selected="false" tabindex="-1">Train</button>
    <button role="tab" data-tab="queue" id="tab-queue" aria-controls="main" aria-selected="false" tabindex="-1">Queue<span class="badge" id="busy" hidden></span></button>
    <button role="tab" data-tab="compare" id="tab-compare" aria-controls="main" aria-selected="false" tabindex="-1">Compare</button>
    <button role="tab" data-tab="inbox" id="tab-inbox" aria-controls="main" aria-selected="false" tabindex="-1">Alerts<span class="badge" id="unread" hidden></span></button>
    <button role="tab" data-tab="review" data-adv id="tab-review" aria-controls="main" aria-selected="false" tabindex="-1">Review</button>
    <button role="tab" data-tab="sweeps" data-adv id="tab-sweeps" aria-controls="main" aria-selected="false" tabindex="-1">Sweeps</button>
  </div>
  <button type="button" id="more" class="more" aria-pressed="false">More</button>
</nav>
<main id="main" role="tabpanel" aria-labelledby="tab-runs"><div class="layout skel" aria-busy="true" role="status"><span class="sr" id="skeltext">Loading…</span><div class="card list"><i></i><i></i><i></i><i></i><i></i></div><div class="card detail"><i class="w40"></i><i class="w25"></i><i class="tall"></i></div></div></main>
<span id="sr" class="sr" role="status" aria-live="polite"></span>
<span id="sra" class="sr" role="alert"></span>

<script src="web/lang.js"></script>
<script src="web/app.js"></script>
<script src="web/compare.js"></script>
<script src="web/alerts.js"></script>
<script src="web/train.js"></script>
<script src="web/queue.js"></script>
<script src="web/versions.js"></script>
<script src="web/classes.js"></script>
<script src="web/machine.js"></script>
<script src="web/ssh.js"></script>
<script src="web/snapshots.js"></script>
<script src="web/review.js"></script>
<script src="web/sweeps.js"></script>
<script src="web/table.js"></script>
<script src="web/main.js"></script>
</body>
</html>
